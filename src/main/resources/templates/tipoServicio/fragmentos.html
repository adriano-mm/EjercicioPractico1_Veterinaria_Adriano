<section th:fragment="formulario">
    <div class="row py-4 mb-2 bg-light">
        <div class="col-md-1"></div>
        <div class="col-md-3">
            <button type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#tipoServicioModal"
                    data-modo="agregar"
                    th:data-titulo="#{tipoServicio.nuevo}">
                [[#{tipoServicio.nuevo}]]
            </button>
        </div>
    </div>

    <div class="modal fade" id="tipoServicioModal" tabindex="-1"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="tipoServicioForm" method="post"
                      th:action="@{/tipoServicio/guardar}">
                    <div class="modal-header" id="tipoServicioModalHeader">
                        <h5 class="modal-title" id="tipoServicioModalTitulo"></h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"
                                th:attr="aria-label=#{tipoServicio.cancelar}">
                        </button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="tipoServicioId" name="id"/>
                        <div class="mb-3">
                            <label for="tipoServicioNombre"
                                   th:text="#{tipoServicio.nombre}"></label>
                            <input type="text" id="tipoServicioNombre"
                                   name="nombre" class="form-control"
                                   maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="tipoServicioDescripcion"
                                   th:text="#{tipoServicio.descripcion}"></label>
                            <input type="text" id="tipoServicioDescripcion"
                                   name="descripcion" class="form-control"
                                   maxlength="255"/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            [[#{tipoServicio.cancelar}]]
                        </button>
                        <button type="submit" class="btn btn-success">
                            [[#{tipoServicio.guardar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-12">
            <div class="card p-2">
                <div class="card-header">
                    <h4>[[#{tipoServicio.titulo}]]</h4>
                </div>
                <div class="card-body">
                    <div th:if="${tipos != null and !tipos.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>[[#{tipoServicio.nombre}]]</th>
                                    <th>[[#{tipoServicio.descripcion}]]</th>
                                    <th>[[#{tipoServicio.cantidadServicios}]]</th>
                                    <th>[[#{tipoServicio.acciones}]]</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="tipo : ${tipos}">
                                    <td th:text="${tipo.id}"></td>
                                    <td th:text="${tipo.nombre}"></td>
                                    <td th:text="${tipo.descripcion}"></td>
                                    <td th:text="${tipo.servicios != null ? tipo.servicios.size() : 0}"></td>
                                    <td>
                                        <button type="button"
                                                class="btn btn-warning btn-sm"
                                                data-bs-toggle="modal"
                                                data-bs-target="#tipoServicioModal"
                                                data-modo="editar"
                                                th:data-titulo="#{tipoServicio.editar}"
                                                th:data-id="${tipo.id}"
                                                th:data-nombre="${tipo.nombre}"
                                                th:data-descripcion="${tipo.descripcion}">
                                            [[#{tipoServicio.editar}]]
                                        </button>
                                        <button type="button"
                                                class="btn btn-danger btn-sm"
                                                data-bs-toggle="modal"
                                                data-bs-target="#confirmarEliminarModal"
                                                th:data-id="${tipo.id}"
                                                th:data-nombre="${tipo.nombre}">
                                            [[#{tipoServicio.eliminar}]]
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2"
                         th:if="${tipos == null or tipos.empty}">
                        [[#{lista.vacia}]]
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

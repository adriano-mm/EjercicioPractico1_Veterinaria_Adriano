<section th:fragment="formulario">
    <div class="row py-4 mb-2 bg-light">
        <div class="col-md-1"></div>
        <div class="col-md-3">
            <button type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#servicioModal"
                    data-modo="agregar"
                    th:data-titulo="#{servicio.nuevo}">
                [[#{servicio.nuevo}]]
            </button>
        </div>
    </div>

    <div class="modal fade" id="servicioModal" tabindex="-1"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="servicioForm" method="post"
                      th:action="@{/servicio/guardar}"
                      th:object="${servicio}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="servicioModalTitulo"></h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"
                                th:attr="aria-label=#{servicio.cancelar}">
                        </button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="servicioId" th:field="*{id}"/>
                        <div class="mb-3">
                            <label for="servicioNombre"
                                   th:text="#{servicio.nombre}"></label>
                            <input type="text" id="servicioNombre"
                                   th:field="*{nombre}" class="form-control"
                                   maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="servicioPrecio"
                                   th:text="#{servicio.precio}"></label>
                            <input type="number" id="servicioPrecio"
                                   th:field="*{precio}" class="form-control"
                                   min="0" step="0.01" required/>
                        </div>
                        <div class="mb-3">
                            <label for="servicioDuracion"
                                   th:text="#{servicio.duracion}"></label>
                            <input type="number" id="servicioDuracion"
                                   th:field="*{duracionMinutos}"
                                   class="form-control" min="1" required/>
                        </div>
                        <div class="mb-3">
                            <label for="servicioTipo"
                                   th:text="#{servicio.tipo}"></label>
                            <select id="servicioTipo" name="tipoServicio.id"
                                    class="form-select" required>
                                <option value=""
                                        th:text="#{servicio.seleccionarTipo}">
                                </option>
                                <option th:each="tipo : ${tiposServicio}"
                                        th:value="${tipo.id}"
                                        th:text="${tipo.nombre}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            [[#{servicio.cancelar}]]
                        </button>
                        <button type="submit" class="btn btn-success">
                            [[#{servicio.guardar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-12">
            <div class="card p-2">
                <div class="card-header">
                    <h4>[[#{servicio.titulo}]]</h4>
                </div>
                <div class="card-body">
                    <div th:if="${servicios != null and !servicios.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>[[#{servicio.nombre}]]</th>
                                    <th>[[#{servicio.tipo}]]</th>
                                    <th>[[#{servicio.precio}]]</th>
                                    <th>[[#{servicio.duracion}]]</th>
                                    <th>[[#{servicio.acciones}]]</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${servicios}">
                                    <td th:text="${item.id}"></td>
                                    <td th:text="${item.nombre}"></td>
                                    <td th:text="${item.tipoServicio.nombre}"></td>
                                    <td th:text="${item.precio}"></td>
                                    <td th:text="${item.duracionMinutos}"></td>
                                    <td>
                                        <button type="button"
                                                class="btn btn-warning btn-sm"
                                                data-bs-toggle="modal"
                                                data-bs-target="#servicioModal"
                                                data-modo="editar"
                                                th:data-titulo="#{servicio.editar}"
                                                th:data-id="${item.id}"
                                                th:data-nombre="${item.nombre}"
                                                th:data-precio="${item.precio}"
                                                th:data-duracion="${item.duracionMinutos}"
                                                th:data-tipo-id="${item.tipoServicio.id}">
                                            [[#{servicio.editar}]]
                                        </button>
                                        <button type="button"
                                                class="btn btn-danger btn-sm"
                                                data-bs-toggle="modal"
                                                data-bs-target="#confirmarEliminarModal"
                                                th:data-id="${item.id}"
                                                th:data-nombre="${item.nombre}"
                                                data-action="/servicio/eliminar">
                                            [[#{servicio.eliminar}]]
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2"
                         th:if="${servicios == null or servicios.empty}">
                        [[#{lista.vacia}]]
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
